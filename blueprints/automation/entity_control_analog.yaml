blueprint:
  name: Launchpad analog entity control
  description: >
    Control a cover, fan, or light with a Launchpad row, column, or button, with LED feedback.
  domain: automation
  input:
    entity:
      name: Entity
      selector:
        entity:
          filter:
            - domain: cover
            - domain: fan
            - domain: light
    only_when_unlocked:
      name: Only run when the lock is unlocked
      description: When enabled, the automation runs only while the selected Home Assistant lock entity is unlocked.
      default: false
      selector:
        boolean:
    lock_entity:
      name: Lock entity
      description: >
        Select the Launchpad Button Lock entity to refresh this automation's
        current LED state when the Launchpad unlocks. It also gates control
        events when the unlocked-only option is enabled.
      default: ""
      selector:
        entity:
          filter:
            - domain: lock
    only_when_profile_active:
      name: Only run when a profile is active
      description: Enable the profile condition below to restrict this automation to a selected active profile.
      default: false
      selector:
        boolean:
    profile_select_entity:
      name: Active profile select entity
      description: MQTT select entity provided by the Launchpad controller.
      default: ""
      selector:
        entity:
          filter:
            - domain: select
    required_profile:
      name: Required profile name
      description: Exact profile name that must be selected for this automation to run.
      default: ""
      selector:
        text:
    layout:
      name: Control layout
      description: Row, column, or one button for the analog entity.
      default: row
      selector:
        select:
          options:
            - row
            - column
            - button
    axis_index:
      name: Row or column number
      default: 0
      selector:
        number:
          min: 0
          max: 7
          step: 1
          mode: box
    control_button:
      name: Single control button
      description: Choose the Launchpad button for button layout.
      default: up
      selector:
        select:
          options:
            - up
            - down
            - left
            - right
            - session
            - user_1
            - user_2
            - mixer
            - grid_8_0
            - grid_0_1
            - grid_1_1
            - grid_2_1
            - grid_3_1
            - grid_4_1
            - grid_5_1
            - grid_6_1
            - grid_7_1
            - volume
            - grid_0_2
            - grid_1_2
            - grid_2_2
            - grid_3_2
            - grid_4_2
            - grid_5_2
            - grid_6_2
            - grid_7_2
            - pan
            - grid_0_3
            - grid_1_3
            - grid_2_3
            - grid_3_3
            - grid_4_3
            - grid_5_3
            - grid_6_3
            - grid_7_3
            - send_a
            - grid_0_4
            - grid_1_4
            - grid_2_4
            - grid_3_4
            - grid_4_4
            - grid_5_4
            - grid_6_4
            - grid_7_4
            - send_b
            - grid_0_5
            - grid_1_5
            - grid_2_5
            - grid_3_5
            - grid_4_5
            - grid_5_5
            - grid_6_5
            - grid_7_5
            - stop
            - grid_0_6
            - grid_1_6
            - grid_2_6
            - grid_3_6
            - grid_4_6
            - grid_5_6
            - grid_6_6
            - grid_7_6
            - mute
            - grid_0_7
            - grid_1_7
            - grid_2_7
            - grid_3_7
            - grid_4_7
            - grid_5_7
            - grid_6_7
            - grid_7_7
            - solo
            - grid_0_8
            - grid_1_8
            - grid_2_8
            - grid_3_8
            - grid_4_8
            - grid_5_8
            - grid_6_8
            - grid_7_8
            - record_arm
    event_type:
      name: Press type
      description: >
        Used in button layout. In row/column layout, single-clicks select a
        level and double-clicking the lowest cell turns the entity off.
      default: single_click
      selector:
        select:
          options:
            - single_click
            - double_click
            - long_press
    single_button_value:
      name: Value for a single-button analog control
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    on_color:
      name: Active color
      description: Lit LED color, used when no gradient is configured.
      default: [0, 255, 0]
      selector:
        color_rgb:
    off_color:
      name: Inactive color
      description: Use black [0, 0, 0] to leave inactive LEDs unlit.
      default: [0, 0, 0]
      selector:
        color_rgb:
    gradient:
      name: Value bar color gradient
      description: >
        Optional JSON list of RGB colors, e.g.
        [[0,0,255],[0,255,0],[255,0,0]]. Leave [] to use the active color.
      default: "[]"
      selector:
        text:
          multiline: true

variables:
  target_entity: !input entity
  only_when_unlocked: !input only_when_unlocked
  selected_lock_entity: !input lock_entity
  only_when_profile_active: !input only_when_profile_active
  selected_profile_entity: !input profile_select_entity
  required_profile: !input required_profile
  entity_domain: "{{ target_entity.split('.')[0] }}"
  selected_layout: !input layout
  selected_axis: !input axis_index
  selected_button: !input control_button
  selected_event: !input event_type
  button_value: !input single_button_value
  active_color: !input on_color
  inactive_color: !input off_color
  gradient_text: !input gradient
trigger_variables:
  selected_lock_entity: !input lock_entity

trigger:
  - platform: mqtt
    topic: device/launchpad/event/state
    id: button_event
  - platform: mqtt
    topic: device/launchpad/availability
    payload: "online"
    id: launchpad_online
  - platform: mqtt
    topic: device/launchpad/light/refresh
    id: brightness_refresh
  - platform: template
    value_template: >
      {{ selected_lock_entity != ''
         and is_state(selected_lock_entity, 'unlocked') }}
    id: lock_unlocked
  - platform: template
    value_template: >
      {{ selected_lock_entity != ''
         and is_state(selected_lock_entity, 'locked') }}
    id: lock_locked
  - platform: state
    entity_id: !input entity
    id: entity_state

condition:
  - condition: template
    value_template: >
      {{ trigger.id == 'lock_locked'
         or not only_when_unlocked
         or is_state(selected_lock_entity, 'unlocked') }}
  - condition: template
    value_template: >
      {{ trigger.id in ['lock_unlocked', 'lock_locked', 'launchpad_online']
         or not only_when_profile_active
         or (selected_profile_entity != ''
           and required_profile | trim != ''
           and is_state(selected_profile_entity, required_profile | trim)) }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'lock_locked' }}"
        sequence:
          - action: mqtt.publish
            data:
              topic: device/launchpad/light/set
              payload: '{"state": "OFF"}'
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_event' and entity_domain in ['cover', 'fan', 'light'] }}"
          - condition: template
            value_template: >
              {% set name = trigger.payload_json.button | default('') %}
              {% set special = {
                'up': [0,0], 'down': [1,0], 'left': [2,0], 'right': [3,0],
                'session': [4,0], 'user_1': [5,0], 'user_2': [6,0], 'mixer': [7,0],
                'volume': [8,1], 'pan': [8,2], 'send_a': [8,3], 'send_b': [8,4],
                'stop': [8,5], 'mute': [8,6], 'solo': [8,7], 'record_arm': [8,8]
              } %}
              {% if name in special %}
                {% set x = special[name][0] %}
                {% set y = special[name][1] %}
              {% elif name.startswith('grid_') %}
                {% set parts = name.split('_') %}
                {% set x = parts[1] | int(-1) %}
                {% set y = parts[2] | int(-1) %}
              {% else %}
                {% set x = -1 %}
                {% set y = -1 %}
              {% endif %}
              {% set analog_axis = entity_domain in ['cover', 'fan', 'light']
                 and selected_layout in ['row', 'column'] %}
              {% set axis_cell = name.startswith('grid_')
                 and ((selected_layout == 'row' and y == (selected_axis | int) + 1 and 0 <= x <= 7)
                   or (selected_layout == 'column' and x == selected_axis and 1 <= y <= 8)) %}
              {% set lowest_cell = (selected_layout == 'row' and x == 0)
                 or (selected_layout == 'column' and y == 8) %}
              {{ (analog_axis and axis_cell and
                   (trigger.payload_json.event_type == 'single_click'
                     or (trigger.payload_json.event_type == 'double_click'
                       and lowest_cell)))
                 or (not analog_axis and trigger.payload_json.event_type == selected_event
                   and (axis_cell or (selected_layout == 'button' and name == selected_button))) }}
        sequence:
          - variables:
              event_name: "{{ trigger.payload_json.button }}"
              special: >
                {{ {'up':[0,0], 'down':[1,0], 'left':[2,0], 'right':[3,0],
                    'session':[4,0], 'user_1':[5,0], 'user_2':[6,0], 'mixer':[7,0],
                    'volume':[8,1], 'pan':[8,2], 'send_a':[8,3], 'send_b':[8,4],
                    'stop':[8,5], 'mute':[8,6], 'solo':[8,7], 'record_arm':[8,8]} }}
              event_x: >
                {% if event_name in special %}
                  {{ special[event_name][0] }}
                {% elif event_name.startswith('grid_') %}
                  {{ event_name.split('_')[1] | int }}
                {% else %}0{% endif %}
              event_y: >
                {% if event_name in special %}
                  {{ special[event_name][1] }}
                {% elif event_name.startswith('grid_') %}
                  {{ event_name.split('_')[2] | int }}
                {% else %}0{% endif %}
              analog_value: >
                {% if selected_layout == 'button' %}
                  {{ (button_value | int) }}
                {% elif selected_layout == 'row' %}
                  {{ (((event_x | int) + 1) * 100 / 8) | round(1) }}
                {% else %}
                  {{ ((9 - (event_y | int)) * 100 / 8) | round(1) }}
                {% endif %}
              analog_off_press: >
                {{ selected_layout in ['row', 'column']
                   and trigger.payload_json.event_type == 'double_click'
                   and ((selected_layout == 'row' and event_x | int == 0)
                     or (selected_layout == 'column' and event_y | int == 8)) }}
              applied_value: >
                {% if selected_layout == 'button' %}
                  {{ button_value | int }}
                {% elif selected_layout == 'row' %}
                  {{ (((event_x | int) + 1) * 100 / 8) | round(1) }}
                {% else %}
                  {{ ((9 - (event_y | int)) * 100 / 8) | round(1) }}
                {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ entity_domain == 'cover' and analog_off_press }}"
                sequence:
                  - action: cover.close_cover
                    target:
                      entity_id: !input entity
              - conditions:
                  - condition: template
                    value_template: "{{ entity_domain == 'cover' }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input entity
                    data:
                      position: "{{ applied_value | int }}"
              - conditions:
                  - condition: template
                    value_template: "{{ entity_domain == 'fan' and analog_off_press }}"
                sequence:
                  - action: fan.turn_off
                    target:
                      entity_id: !input entity
              - conditions:
                  - condition: template
                    value_template: "{{ entity_domain == 'fan' }}"
                sequence:
                  - action: fan.set_percentage
                    target:
                      entity_id: !input entity
                    data:
                      percentage: "{{ applied_value | int }}"
              - conditions:
                  - condition: template
                    value_template: "{{ entity_domain == 'light' }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: >
                          {{ analog_off_press
                             or (selected_layout == 'button' and analog_value | float == 0) }}
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: !input entity
                    else:
                      - action: light.turn_on
                        target:
                          entity_id: !input entity
                        data:
                          brightness_pct: "{{ applied_value | float }}"
                          rgb_color: !input on_color

      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id in ['entity_state', 'launchpad_online', 'lock_unlocked', 'brightness_refresh']
                 and entity_domain in ['cover', 'fan', 'light']
                 and (selected_lock_entity == ''
                   or is_state(selected_lock_entity, 'unlocked')) }}
        sequence:
          - variables:
              state_value: >
                {% if entity_domain == 'cover' %}
                  {{ state_attr(target_entity, 'current_position') | int(0) }}
                {% elif entity_domain == 'fan' %}
                  {{ state_attr(target_entity, 'percentage') | int(0) if is_state(target_entity, 'on') else 0 }}
                {% else %}
                  {% if is_state(target_entity, 'on') %}
                    {{ (state_attr(target_entity, 'brightness') | int(0) * 100 / 255) | round(0) | int }}
                  {% else %}0{% endif %}
                {% endif %}
              gradient_colors: "{{ gradient_text | from_json }}"
              single_coords: >
                {% set special = {
                  'up':[0,0], 'down':[1,0], 'left':[2,0], 'right':[3,0],
                  'session':[4,0], 'user_1':[5,0], 'user_2':[6,0], 'mixer':[7,0],
                  'volume':[8,1], 'pan':[8,2], 'send_a':[8,3], 'send_b':[8,4],
                  'stop':[8,5], 'mute':[8,6], 'solo':[8,7], 'record_arm':[8,8]
                } %}
                {% if selected_button in special %}
                  {{ special[selected_button] }}
                {% else %}
                  {% set parts = selected_button.split('_') %}
                  {{ [parts[1] | int(0), parts[2] | int(0)] }}
                {% endif %}
          - repeat:
              for_each: "{{ range(81) | list }}"
              sequence:
                - variables:
                    pixel_x: "{{ repeat.item % 9 }}"
                    pixel_y: "{{ repeat.item // 9 }}"
                    axis_position: >
                      {% if selected_layout == 'row' %}
                        {{ pixel_x | int }}
                      {% else %}
                        {{ (pixel_y | int) - 1 }}
                      {% endif %}
                    pixel_selected: >
                      {{ (selected_layout == 'row'
                           and pixel_y | int == (selected_axis | int) + 1
                           and 0 <= pixel_x | int <= 7)
                         or (selected_layout == 'column' and pixel_x | int == selected_axis | int
                           and 1 <= pixel_y | int <= 8)
                         or (selected_layout == 'button'
                           and pixel_x | int == single_coords[0] | int
                           and pixel_y | int == single_coords[1] | int) }}
                    pixel_color: >
                      {% set active_count = (state_value | int * 8 / 100) | round(0) | int %}
                      {% if selected_layout != 'button' and axis_position | int >= active_count %}
                        {{ inactive_color }}
                      {% elif gradient_colors | length > 0 and selected_layout != 'button' %}
                        {% set color_index = (axis_position | int * (gradient_colors | length - 1) / 7) | round(0) | int %}
                        {{ gradient_colors[color_index] }}
                      {% else %}
                        {{ active_color }}
                      {% endif %}
                - if:
                    - condition: template
                      value_template: "{{ pixel_selected }}"
                  then:
                    - action: mqtt.publish
                      data:
                        topic: device/launchpad/light/set
                        payload: >-
                          {{ {
                            'state': 'ON',
                            'x': pixel_x | int,
                            'y': pixel_y | int,
                            'color': {
                              'r': pixel_color[0] | int,
                              'g': pixel_color[1] | int,
                              'b': pixel_color[2] | int
                            },
                            'effect': 'static'
                          } | tojson }}

mode: restart
