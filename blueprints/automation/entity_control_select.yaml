blueprint:
  name: Launchpad select control
  description: >
    Choose an option from a select entity with one Launchpad button and optional LED colors or sequences.
  domain: automation
  input:
    entity:
      name: Entity
      selector:
        entity:
          filter:
            - domain: select
    only_when_unlocked:
      name: Only run when the lock is unlocked
      description: When enabled, the automation runs only while the selected Home Assistant lock entity is unlocked.
      default: false
      selector:
        boolean:
    lock_entity:
      name: Lock entity
      description: >
        Select the Launchpad Button Lock entity to refresh this automation's
        current LED state when the Launchpad unlocks. It also gates control
        events when the unlocked-only option is enabled.
      default: ""
      selector:
        entity:
          filter:
            - domain: lock
    only_when_profile_active:
      name: Only run when a profile is active
      description: Enable the profile condition below to restrict this automation to a selected active profile.
      default: false
      selector:
        boolean:
    profile_select_entity:
      name: Active profile select entity
      description: MQTT select entity provided by the Launchpad controller.
      default: ""
      selector:
        entity:
          filter:
            - domain: select
    required_profile:
      name: Required profile name
      description: Exact profile name that must be selected for this automation to run.
      default: ""
      selector:
        text:
    control_button:
      name: Launchpad button
      default: up
      selector:
        select:
          options:
            - up
            - down
            - left
            - right
            - session
            - user_1
            - user_2
            - mixer
            - grid_8_0
            - grid_0_1
            - grid_1_1
            - grid_2_1
            - grid_3_1
            - grid_4_1
            - grid_5_1
            - grid_6_1
            - grid_7_1
            - volume
            - grid_0_2
            - grid_1_2
            - grid_2_2
            - grid_3_2
            - grid_4_2
            - grid_5_2
            - grid_6_2
            - grid_7_2
            - pan
            - grid_0_3
            - grid_1_3
            - grid_2_3
            - grid_3_3
            - grid_4_3
            - grid_5_3
            - grid_6_3
            - grid_7_3
            - send_a
            - grid_0_4
            - grid_1_4
            - grid_2_4
            - grid_3_4
            - grid_4_4
            - grid_5_4
            - grid_6_4
            - grid_7_4
            - send_b
            - grid_0_5
            - grid_1_5
            - grid_2_5
            - grid_3_5
            - grid_4_5
            - grid_5_5
            - grid_6_5
            - grid_7_5
            - stop
            - grid_0_6
            - grid_1_6
            - grid_2_6
            - grid_3_6
            - grid_4_6
            - grid_5_6
            - grid_6_6
            - grid_7_6
            - mute
            - grid_0_7
            - grid_1_7
            - grid_2_7
            - grid_3_7
            - grid_4_7
            - grid_5_7
            - grid_6_7
            - grid_7_7
            - solo
            - grid_0_8
            - grid_1_8
            - grid_2_8
            - grid_3_8
            - grid_4_8
            - grid_5_8
            - grid_6_8
            - grid_7_8
            - record_arm
    event_type:
      name: Press type
      default: single_click
      selector:
        select:
          options:
            - single_click
            - double_click
            - long_press
    selected_option:
      name: Select option
      description: Exact option name from the selected select entity.
      default: ""
      selector:
        text:
    on_color:
      name: Active color
      description: Fallback LED color for options without a color override.
      default: [0, 255, 0]
      selector:
        color_rgb:
    off_color:
      name: Inactive color
      description: Use black [0, 0, 0] to leave inactive LEDs unlit.
      default: [0, 0, 0]
      selector:
        color_rgb:
    select_colors:
      name: Select option colors
      description: >
        Optional JSON object mapping option names to RGB lists, e.g.
        {"Home":[0,255,0],"Away":[255,0,0]}.
      default: "{}"
      selector:
        text:
          multiline: true
    select_sequences:
      name: Select option color sequences
      description: Optional JSON object mapping option names to RGB lists for timed animation.
      default: "{}"
      selector:
        text:
          multiline: true
    sequence_step_seconds:
      name: Select sequence step duration
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: s
          mode: box
    sequence_cycles:
      name: Number of select sequence cycles
      default: 3
      selector:
        number:
          min: 1
          max: 50
          step: 1
          mode: box


variables:
  target_entity: !input entity
  only_when_unlocked: !input only_when_unlocked
  selected_lock_entity: !input lock_entity
  only_when_profile_active: !input only_when_profile_active
  selected_profile_entity: !input profile_select_entity
  required_profile: !input required_profile
  entity_domain: "{{ target_entity.split('.')[0] }}"
  selected_button: !input control_button
  selected_event: !input event_type
  selected_option: !input selected_option
  active_color: !input on_color
  inactive_color: !input off_color
  select_colors_text: !input select_colors
  select_sequences_text: !input select_sequences
  sequence_step: !input sequence_step_seconds
  sequence_cycles_count: !input sequence_cycles

trigger_variables:
  selected_lock_entity: !input lock_entity

trigger:
  - platform: mqtt
    topic: device/launchpad/event/state
    id: button_event
  - platform: mqtt
    topic: device/launchpad/availability
    payload: "online"
    id: launchpad_online
  - platform: mqtt
    topic: device/launchpad/light/refresh
    id: brightness_refresh
  - platform: template
    value_template: >
      {{ selected_lock_entity != ''
         and is_state(selected_lock_entity, 'unlocked') }}
    id: lock_unlocked
  - platform: template
    value_template: >
      {{ selected_lock_entity != ''
         and is_state(selected_lock_entity, 'locked') }}
    id: lock_locked
  - platform: state
    entity_id: !input entity
    id: entity_state

condition:
  - condition: template
    value_template: >
      {{ trigger.id == 'lock_locked'
         or not only_when_unlocked
         or is_state(selected_lock_entity, 'unlocked') }}
  - condition: template
    value_template: >
      {{ trigger.id in ['lock_unlocked', 'lock_locked', 'launchpad_online']
         or not only_when_profile_active
         or (selected_profile_entity != ''
           and required_profile | trim != ''
           and is_state(selected_profile_entity, required_profile | trim)) }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'lock_locked' }}"
        sequence:
          - action: mqtt.publish
            data:
              topic: device/launchpad/light/set
              payload: '{"state": "OFF"}'
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_event' and entity_domain == 'select' }}"
          - condition: template
            value_template: >
              {{ trigger.payload_json.button == selected_button
                 and trigger.payload_json.event_type == selected_event
                 and selected_option in state_attr(target_entity, 'options') }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input entity
            data:
              option: "{{ selected_option }}"

      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id in ['entity_state', 'launchpad_online', 'lock_unlocked', 'brightness_refresh']
                 and entity_domain == 'select'
                 and (selected_lock_entity == ''
                   or is_state(selected_lock_entity, 'unlocked')) }}
        sequence:
          - variables:
              option_colors: "{{ select_colors_text | from_json }}"
              option_sequences: "{{ select_sequences_text | from_json }}"
          - variables:
              button_coords: >
                {% set special = {
                  'up':[0,0], 'down':[1,0], 'left':[2,0], 'right':[3,0],
                  'session':[4,0], 'user_1':[5,0], 'user_2':[6,0], 'mixer':[7,0],
                  'volume':[8,1], 'pan':[8,2], 'send_a':[8,3], 'send_b':[8,4],
                  'stop':[8,5], 'mute':[8,6], 'solo':[8,7], 'record_arm':[8,8]
                } %}
                {% if selected_button in special %}{{ special[selected_button] }}
                {% else %}
                  {% set parts = selected_button.split('_') %}
                  {{ [parts[1] | int(0), parts[2] | int(0)] }}
                {% endif %}
              mapping_color: >
                {% if states(target_entity) == selected_option %}
                  {{ option_colors.get(selected_option, active_color) }}
                {% else %}
                  {{ inactive_color }}
                {% endif %}
              selected_mapping_sequence: "{{ option_sequences.get(selected_option, []) }}"
          - action: mqtt.publish
            data:
              topic: device/launchpad/light/set
              payload: >-
                {{ {
                  'state': 'ON',
                  'x': button_coords[0] | int,
                  'y': button_coords[1] | int,
                  'color': {
                    'r': mapping_color[0] | int,
                    'g': mapping_color[1] | int,
                    'b': mapping_color[2] | int
                  }
                } | tojson }}
          - if:
              - condition: template
                value_template: >
                  {{ trigger.id == 'entity_state'
                     and selected_option != ''
                     and selected_mapping_sequence | length > 0 }}
            then:
              - repeat:
                  count: "{{ sequence_cycles_count | int }}"
                  sequence:
                    - repeat:
                        for_each: "{{ selected_mapping_sequence }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: device/launchpad/light/set
                              payload: >-
                                {{ {
                                  'state': 'ON',
                                  'x': button_coords[0] | int,
                                  'y': button_coords[1] | int,
                                  'color': {
                                    'r': repeat.item[0] | int,
                                    'g': repeat.item[1] | int,
                                    'b': repeat.item[2] | int
                                  }
                                } | tojson }}
                          - delay:
                              seconds: "{{ sequence_step | float }}"

mode: restart
