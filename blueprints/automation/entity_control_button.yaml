blueprint:
  name: Launchpad button entity control
  description: >
    Press a Home Assistant button entity from a mapped Launchpad button and press type.
  domain: automation
  input:
    entity:
      name: Entity
      selector:
        entity:
          filter:
            - domain: button
    only_when_unlocked:
      name: Only run when the lock is unlocked
      description: When enabled, the automation runs only while the selected Home Assistant lock entity is unlocked.
      default: false
      selector:
        boolean:
    lock_entity:
      name: Lock entity
      description: >
        Select the Launchpad Button Lock entity to refresh this automation's
        current LED state when the Launchpad unlocks. It also gates control
        events when the unlocked-only option is enabled.
      default: ""
      selector:
        entity:
          filter:
            - domain: lock
    only_when_profile_active:
      name: Only run when a profile is active
      description: Enable the profile condition below to restrict this automation to a selected active profile.
      default: false
      selector:
        boolean:
    profile_select_entity:
      name: Active profile select entity
      description: MQTT select entity provided by the Launchpad controller.
      default: ""
      selector:
        entity:
          filter:
            - domain: select
    required_profile:
      name: Required profile name
      description: Exact profile name that must be selected for this automation to run.
      default: ""
      selector:
        text:
    control_button:
      name: Launchpad button
      default: up
      selector:
        select:
          options:
            - grid_0_1
            - grid_0_2
            - grid_0_3
            - grid_0_4
            - grid_0_5
            - grid_0_6
            - grid_0_7
            - grid_0_8
            - grid_1_1
            - grid_1_2
            - grid_1_3
            - grid_1_4
            - grid_1_5
            - grid_1_6
            - grid_1_7
            - grid_1_8
            - grid_2_1
            - grid_2_2
            - grid_2_3
            - grid_2_4
            - grid_2_5
            - grid_2_6
            - grid_2_7
            - grid_2_8
            - grid_3_1
            - grid_3_2
            - grid_3_3
            - grid_3_4
            - grid_3_5
            - grid_3_6
            - grid_3_7
            - grid_3_8
            - grid_4_1
            - grid_4_2
            - grid_4_3
            - grid_4_4
            - grid_4_5
            - grid_4_6
            - grid_4_7
            - grid_4_8
            - grid_5_1
            - grid_5_2
            - grid_5_3
            - grid_5_4
            - grid_5_5
            - grid_5_6
            - grid_5_7
            - grid_5_8
            - grid_6_1
            - grid_6_2
            - grid_6_3
            - grid_6_4
            - grid_6_5
            - grid_6_6
            - grid_6_7
            - grid_6_8
            - grid_7_1
            - grid_7_2
            - grid_7_3
            - grid_7_4
            - grid_7_5
            - grid_7_6
            - grid_7_7
            - grid_7_8
            - grid_8_0
            - up
            - down
            - left
            - right
            - session
            - user_1
            - user_2
            - mixer
            - volume
            - pan
            - send_a
            - send_b
            - stop
            - mute
            - solo
            - record_arm
    event_type:
      name: Press type
      default: single_click
      selector:
        select:
          options:
            - single_click
            - double_click
            - long_press

variables:
  target_entity: !input entity
  only_when_unlocked: !input only_when_unlocked
  selected_lock_entity: !input lock_entity
  only_when_profile_active: !input only_when_profile_active
  selected_profile_entity: !input profile_select_entity
  required_profile: !input required_profile
  entity_domain: "{{ target_entity.split('.')[0] }}"
  selected_button: !input control_button
  selected_event: !input event_type
trigger_variables:
  selected_lock_entity: !input lock_entity

trigger:
  - platform: mqtt
    topic: device/launchpad/event/state
    id: button_event
  - platform: mqtt
    topic: device/launchpad/availability
    payload: "online"
    id: launchpad_online
  - platform: mqtt
    topic: device/launchpad/light/refresh
    id: brightness_refresh
  - platform: template
    value_template: >
      {{ selected_lock_entity != ''
         and is_state(selected_lock_entity, 'unlocked') }}
    id: lock_unlocked
  - platform: template
    value_template: >
      {{ selected_lock_entity != ''
         and is_state(selected_lock_entity, 'locked') }}
    id: lock_locked
  - platform: state
    entity_id: !input entity
    id: entity_state

condition:
  - condition: template
    value_template: >
      {{ trigger.id == 'lock_locked'
         or not only_when_unlocked
         or selected_lock_entity == ''
         or is_state(selected_lock_entity, 'unlocked') }}
  - condition: template
    value_template: >
      {{ trigger.id in ['lock_unlocked', 'lock_locked', 'launchpad_online']
         or not only_when_profile_active
         or (selected_profile_entity != ''
           and required_profile | trim != ''
           and is_state(selected_profile_entity, required_profile | trim)) }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ only_when_unlocked
                 and selected_lock_entity != ''
                 and trigger.id == 'lock_locked' }}
        sequence:
          - action: mqtt.publish
            data:
              topic: device/launchpad/light/set
              payload: '{"state": "OFF"}'
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_event' and entity_domain == 'button' }}"
          - condition: template
            value_template: >
              {{ trigger.payload_json.button == selected_button
                 and trigger.payload_json.event_type == selected_event }}
        sequence:
          - action: button.press
            target:
              entity_id: !input entity

mode: restart
