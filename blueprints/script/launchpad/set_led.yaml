blueprint:
  name: Launchpad - Static color
  description: Set a static color on one button, a row, a column, or the whole board.
  domain: script
  input:
    command_topic:
      name: MQTT command topic
      default: device/launchpad/light/set
      selector:
        text:

fields:
  layout:
    name: Display layout
    required: true
    default: button
    selector:
      select:
        options:
          - button
          - row
          - column
          - all
  x:
    name: X coordinate or column
    default: 0
    selector:
      number:
        min: 0
        max: 8
        step: 1
        mode: box
  y:
    name: Y coordinate or row
    default: 0
    selector:
      number:
        min: 0
        max: 8
        step: 1
        mode: box
  color:
    name: RGB color
    default: [0, 255, 0]
    selector:
      color_rgb:
  effect:
    name: LED effect
    default: static
    selector:
      select:
        options:
          - static
          - flash
          - pulse

sequence:
  - repeat:
      for_each: "{{ range(81) | list }}"
      sequence:
        - variables:
            pixel_x: "{{ repeat.item % 9 }}"
            pixel_y: "{{ repeat.item // 9 }}"
        - if:
            - condition: template
              value_template: >
                {{ layout == 'all'
                   or (layout == 'row' and pixel_y | int == y | int)
                   or (layout == 'column' and pixel_x | int == x | int)
                   or (layout == 'button' and pixel_x | int == x | int and pixel_y | int == y | int) }}
          then:
            - action: mqtt.publish
              data:
                topic: !input command_topic
                payload: >-
                  {{ {
                    'state': 'ON',
                    'x': pixel_x | int,
                    'y': pixel_y | int,
                    'color': {'r': color[0] | int, 'g': color[1] | int, 'b': color[2] | int},
                    'effect': effect | default('static')
                  } | tojson }}
