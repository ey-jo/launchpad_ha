blueprint:
  name: Launchpad - Scroll text
  description: Display or scroll text across the Launchpad.
  domain: script
  input:
    command_topic:
      name: MQTT command topic
      description: Change "launchpad" if your DEVICE_ID is different.
      default: device/launchpad/light/set
      selector:
        text:

fields:
  text:
    name: Text
    required: true
    selector:
      text:
  direction:
    name: Direction
    default: left
    selector:
      select:
        options:
          - left
          - right
  r:
    name: Red
    default: 255
    selector:
      number:
        min: 0
        max: 255
        step: 1
        mode: slider
  g:
    name: Green
    default: 255
    selector:
      number:
        min: 0
        max: 255
        step: 1
        mode: slider
  b:
    name: Blue
    default: 255
    selector:
      number:
        min: 0
        max: 255
        step: 1
        mode: slider

sequence:
  - action: mqtt.publish
    data:
      topic: !input command_topic
      payload: >-
        {
          "state": "ON",
          "text": {{ text | tojson }},
          "direction": {{ direction | default('left') | tojson }},
          "color": {
            "r": {{ r | default(255) | int }},
            "g": {{ g | default(255) | int }},
            "b": {{ b | default(255) | int }}
          }
        }
