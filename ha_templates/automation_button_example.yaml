alias: Launchpad grid_0_0 single click
trigger:
  - platform: mqtt
    topic: "device/launchpad/event/state"
condition:
  - condition: template
    value_template: >
      {{ trigger.payload_json.event_type == 'single_click'
         and trigger.payload_json.button == 'grid_0_0' }}
action:
  - service: mqtt.publish
    data:
      topic: "device/launchpad/light/set"
      payload: >-
        {"x":0,"y":0,"color":{"r":255,"g":0,"b":0},"brightness":200,"effect":"static"}